# Phase 2 — HTTPS (add ONLY after cert crexline-devbot exists)

server {
    listen 443 ssl;
    http2 on;
    server_name devbot.crexline.com;

    ssl_certificate     /etc/letsencrypt/live/crexline-devbot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crexline-devbot/privkey.pem;

    location / {
        proxy_pass http://deriv-frontend-1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name backdev.crexline.com;

    ssl_certificate     /etc/letsencrypt/live/crexline-devbot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crexline-devbot/privkey.pem;

    location / {
        proxy_pass http://deriv-backend-1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
