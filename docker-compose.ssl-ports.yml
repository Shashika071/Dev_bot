# HTTPS on custom port 8443 — does NOT bind host :80/:443 (Fiyola untouched).
#
# URLs:
#   https://devbot.crexline.com:8443
#   https://backdev.crexline.com:8443
#
# Needs Cloudflare Origin Certificate files:
#   ./certs/origin.pem
#   ./certs/origin.key
#
# Cloudflare SSL mode: Full (or Full Strict)
# Port 8443 is allowed through Cloudflare orange-cloud proxy.

services:
  edge:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${DERIV_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./deploy/edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/origin.pem:/etc/nginx/certs/origin.pem:ro
      - ./certs/origin.key:/etc/nginx/certs/origin.key:ro
    mem_limit: 128m
    networks:
      - deriv_net
