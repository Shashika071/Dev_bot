# VPS deploy (same project name as before: deriv)
# Does NOT bind host :80 or :443 — use ssl-ports edge on 8443.
#
#   docker compose -p deriv \
#     -f docker-compose.prod.yml \
#     -f docker-compose.ssl-ports.yml \
#     --env-file .env.prod \
#     up -d --build --force-recreate frontend edge
#
# URL: https://devbot.crexline.com:8443
# Needs: ./certs/origin.pem + ./certs/origin.key (Cloudflare Origin Cert)

name: deriv

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DERIV_PUBLIC_WS: ${VITE_DERIV_PUBLIC_WS:-wss://api.derivws.com/trading/v1/options/ws/public}
        VITE_DERIV_SYMBOL: ${VITE_DERIV_SYMBOL:-R_100}
        VITE_HISTORY_COUNT: ${VITE_HISTORY_COUNT:-5000}
        VITE_SOUND_ALERTS: ${VITE_SOUND_ALERTS:-true}
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - deriv_net

networks:
  deriv_net:
    driver: bridge
