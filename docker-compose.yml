services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deriv_bot}
      POSTGRES_USER: ${POSTGRES_USER:-deriv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    # Low-memory settings — Docker Desktop OOM was killing startup after big builds
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=40
      - -c
      - wal_buffers=4MB
    # Not published to host by default — use docker network only
    expose:
      - "5432"
    volumes:
      # Keep DB OUTSIDE ./data — backend also mounts ./data for models/parquet.
      # Deleting ./data must NOT wipe ticks. Survives: docker compose down / --build.
      # Still avoid: docker compose down -v  AND  deleting the ./pgdata folder.
      - ./pgdata:/var/lib/postgresql/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deriv} -d ${POSTGRES_DB:-deriv_bot}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: python -m app.worker

  digitmatch-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.digitmatch.worker

  digitmatch-trainer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.digitmatch.train_worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000}

# Named volumes intentionally unused for DB — data lives in ./data/postgres on disk.
