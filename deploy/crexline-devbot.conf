# Drop this file onto the VPS Fiyola nginx conf.d folder, OR paste into production.conf.
# SSL uses the same Let's Encrypt store already mounted into fiyola-prod-nginx.
#
# On VPS:
#   1) Fix backend first: docker logs deriv-backend-1 --tail 80
#   2) Copy this file OR append into production.conf
#   3) docker exec fiyola-prod-nginx nginx -t && docker exec fiyola-prod-nginx nginx -s reload

# UI — https://devbot.crexline.com
server {
    listen 80;
    server_name devbot.crexline.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name devbot.crexline.com;

    # If crexline.com already has a cert, use it. Otherwise create one for these hosts.
    ssl_certificate     /etc/letsencrypt/live/crexline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crexline.com/privkey.pem;

    location / {
        proxy_pass http://deriv-frontend-1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API — https://backdev.crexline.com
server {
    listen 80;
    server_name backdev.crexline.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name backdev.crexline.com;

    ssl_certificate     /etc/letsencrypt/live/crexline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crexline.com/privkey.pem;

    location / {
        proxy_pass http://deriv-backend-1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
