# Phase 1 — HTTP only (ACME challenge). Safe before cert exists.

server {
    listen 80;
    server_name devbot.crexline.com backdev.crexline.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
