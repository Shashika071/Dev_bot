# New V100 Smart Signal Bot (React SPA only).
# Old postgres/backend/worker compose files are obsolete leftovers — do not use them.
#
# Local / VPS:
#   docker compose up -d --build
# Then open http://localhost:8080
#
# Behind an existing nginx (e.g. crexline):
#   proxy_pass http://v100-signal:80;

name: v100-signal

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DERIV_PUBLIC_WS: ${VITE_DERIV_PUBLIC_WS:-wss://api.derivws.com/trading/v1/options/ws/public}
        VITE_DERIV_SYMBOL: ${VITE_DERIV_SYMBOL:-R_100}
        VITE_HISTORY_COUNT: ${VITE_HISTORY_COUNT:-5000}
        VITE_SOUND_ALERTS: ${VITE_SOUND_ALERTS:-true}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    mem_limit: 128m
