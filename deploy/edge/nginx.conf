# Bot-owned HTTPS edge on :8443 (does not use host :80/:443).
# Place Cloudflare Origin certs at:
#   ./certs/origin.pem
#   ./certs/origin.key

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_origin $cors_origin {
    default "";
    "https://devbot.crexline.com:8443"  $http_origin;
    "https://devbot.crexline.com"       $http_origin;
    "https://backdev.crexline.com:8443" $http_origin;
    "https://backdev.crexline.com"      $http_origin;
    "http://localhost:5173"             $http_origin;
    "http://127.0.0.1:5173"             $http_origin;
}

upstream deriv_ui {
    server frontend:80;
}

upstream deriv_api {
    server backend:8000;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name devbot.crexline.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://deriv_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name backdev.crexline.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        proxy_pass http://deriv_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;

        # The app also sends these. Hide them so a 502 page can carry one copy.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
        add_header Vary Origin always;
    }
}
