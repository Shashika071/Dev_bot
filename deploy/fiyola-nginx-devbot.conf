# Add these server blocks to the EXISTING fiyola nginx config
# (the one used by container fiyola-prod-nginx). Do NOT start a second
# host nginx on :80/:443 — reuse the one already bound.
#
# After edit, reload that container only, e.g.:
#   docker exec fiyola-prod-nginx nginx -t && docker exec fiyola-prod-nginx nginx -s reload
#
# Containers must share network "edge":
#   docker network create edge   # once
#   docker network connect edge fiyola-prod-nginx
#   (deriv compose already joins backend + frontend to edge)

# UI — https://devbot.crexline.com
server {
    listen 443 ssl http2;
    server_name devbot.crexline.com;

    # Reuse whatever SSL paths Fiyola already uses (Cloudflare full/strict
    # or certbot). Example placeholders — match your real cert files:
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_pass http://deriv-frontend-1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API + WebSocket — https://backdev.crexline.com
server {
    listen 443 ssl http2;
    server_name backdev.crexline.com;

    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_pass http://deriv-backend-1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

