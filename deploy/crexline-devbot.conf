map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Append to:
#   /home/fiyola-production/fiyola/nginx/conf.d/production.conf
#
# FIRST issue a cert (see deploy/issue-crexline-cert.sh), THEN enable the
# 443 server blocks below. Until the cert exists, keep only the :80 blocks.

# --- HTTP: ACME + redirect ---
server {
    listen 80;
    server_name devbot.crexline.com backdev.crexline.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS UI: https://devbot.crexline.com ---
# Uncomment after cert is issued:
server {
    listen 443 ssl http2;
    server_name devbot.crexline.com;

    ssl_certificate     /etc/letsencrypt/live/crexline-devbot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crexline-devbot/privkey.pem;

    location / {
        proxy_pass http://deriv-frontend-1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- HTTPS API: https://backdev.crexline.com ---
server {
    listen 443 ssl http2;
    server_name backdev.crexline.com;

    ssl_certificate     /etc/letsencrypt/live/crexline-devbot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crexline-devbot/privkey.pem;

    location / {
        proxy_pass http://deriv-backend-1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
