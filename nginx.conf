server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed Vite assets
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # Browser talks to Deriv WS directly — no API proxy required
}
