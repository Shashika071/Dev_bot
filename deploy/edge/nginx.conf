# TLS edge for V100 Smart Signal Bot (SPA only — no backend).
# Listens on 8443; proxies to frontend:80 on deriv_net.

upstream v100_frontend {
  server frontend:80;
}

upstream v100_research {
  server research:8787;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name devbot.crexline.com;

  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # Always-on paper research collector (no trading)
  location /research-api/ {
    proxy_pass http://v100_research/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://v100_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Old API host — SPA needs no API; return a clear message if something still hits it.
server {
  listen 8443 ssl;
  http2 on;
  server_name backdev.crexline.com;

  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  location / {
    default_type text/plain;
    return 410 'This Deriv bot no longer has a backend. Use https://devbot.crexline.com:8443';
  }
}
